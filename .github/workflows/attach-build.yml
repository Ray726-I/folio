name: Attach build packages

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Actions run containing folio-linux-x64
        required: true
        type: string
      release:
        description: Existing release tag
        required: true
        type: string

permissions:
  actions: read
  contents: write

jobs:
  attach:
    runs-on: ubuntu-24.04
    steps:
      - name: Download Ubuntu packages
        uses: actions/download-artifact@v4
        with:
          name: folio-linux-x64
          run-id: ${{ inputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: packages
      - name: Attach packages to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release }}
        run: gh release upload "$RELEASE_TAG" packages/deb/*.deb packages/appimage/*.AppImage
