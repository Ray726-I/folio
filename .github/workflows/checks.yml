name: Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - name: Install Rust components
        run: rustup component add rustfmt clippy
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run Rust tests
        run: cargo test --locked
      - name: Check Rust diagnostics
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Build parser fixture
        run: cargo build --locked --example editor-fixture
      - name: Install UI test dependencies
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Run UI checks
        run: |
          npm run test:ui
          node tests/live-editor.cjs
