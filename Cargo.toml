[package]
name = "folio"
version = "0.1.0"
description = "A quiet, file-focused Markdown reader and editor"
edition = "2021"
license = "MIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
comrak = { version = "0.56", default-features = false, features = ["syntect-fancy", "shortcodes"] }
ammonia = "4"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
tempfile = "3"
toml = "0.8"
percent-encoding = "2"
syntect = { version = "5", default-features = false, features = ["default-fancy"] }

[dev-dependencies]
serde_json = "1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
